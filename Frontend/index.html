<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f5f5f7">
    <!-- Fija el tema antes de cargar la app para que no parpadee -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('techfix-tema')
          if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'oscuro' : 'claro'
          if (t === 'oscuro') document.documentElement.setAttribute('data-theme', 'oscuro')
        } catch (e) {}
      })()
    </script>
    <!-- En Mac se usa la fuente del sistema (SF Pro); en Windows, Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <title>TechFix</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
